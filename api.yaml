openapi: 3.0.0
info:
  title: Placement Portal API
  version: 2.0.0
  description: Comprehensive Placement Management System API
  contact:
    name: Placement Portal Team

servers:
  - url: http://127.0.0.1:5000
    description: Development Server

paths:

  # ====================== AUTH ======================
  /api/auth/login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }

  /api/auth/register/student:
    post:
      summary: Register Student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                name: { type: string }
                email: { type: string }
                branch: { type: string }
                cgpa: { type: number }
                year: { type: integer }

  /api/auth/register/company:
    post:
      summary: Register Company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                name: { type: string }
                email: { type: string }
                company_name: { type: string }
                hr_contact: { type: string }
                website: { type: string }

  /api/auth/logout:
    post:
      summary: Logout User
      responses:
        '200': { description: Logged out successfully }

  /api/auth/me:
    get:
      summary: Get Current User Profile
      responses:
        '200': { description: User profile }

  # ====================== ADMIN ======================
  /api/admin/stats:
    get:
      summary: Get Admin Dashboard Statistics
      responses:
        '200': { description: Statistics returned }

  /api/admin/companies:
    get:
      summary: List All Companies
      parameters:
        - name: search
          in: query
          schema: { type: string }

  /api/admin/students:
    get:
      summary: List All Students
      parameters:
        - name: search
          in: query
          schema: { type: string }

  /api/admin/drives:
    get:
      summary: List All Placement Drives

  /api/admin/applications:
    get:
      summary: List All Applications

  /api/admin/approve/company/{company_id}:
    post:
      summary: Approve/Reject Company

  /api/admin/approve/drive/{drive_id}:
    post:
      summary: Approve/Reject Placement Drive

  # ====================== STUDENT ======================
  /api/student/drives:
    get:
      summary: Get Available Placement Drives
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: min_cgpa
          in: query
          schema: { type: number }
        - name: branch
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
        - name: sort_by
          in: query
          schema: 
            type: string
            enum: [created_at, deadline, company]

  /api/student/applications:
    get:
      summary: Get Student's Applications

  /api/student/apply/{drive_id}:
    post:
      summary: Apply to a Placement Drive

  /api/student/resume/upload:
    post:
      summary: Upload Resume

  /api/student/resume/download:
    get:
      summary: Download Own Resume

  /api/student/export-applications:
    post:
      summary: Export Applications as CSV (via email)

  # ====================== COMPANY ======================
  /api/company/profile:
    get:
      summary: Get Company Profile
    put:
      summary: Update Company Profile

  /api/company/drives:
    get:
      summary: Get Company's Drives
    post:
      summary: Create New Placement Drive

  /api/company/applications:
    get:
      summary: Get Applications for Company's Drives

  /api/company/applications/{app_id}/status:
    put:
      summary: Update Application Status

  /api/company/interviews:
    get:
      summary: Get Scheduled Interviews
    post:
      summary: Schedule New Interview

  # ====================== REPORTS ======================
  /api/admin/reports/placement-summary:
    get:
      summary: Download Placement Summary PDF Report

  /api/admin/reports/student-placement:
    get:
      summary: Download Student Placement Report

  /api/admin/reports/company-performance:
    get:
      summary: Download Company Performance Report
