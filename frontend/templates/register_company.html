{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5">
                <h3 class="text-center mb-4">Company Registration</h3>
                <form id="registerCompanyForm">
                    <div class="mb-3">
                        <input type="text" id="company_name" class="form-control" placeholder="Company Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" id="username" class="form-control" placeholder="Username" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" id="email" class="form-control" placeholder="HR Email" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" id="hr_contact" class="form-control" placeholder="HR Contact Number" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Password</label>
                        <div class="input-group">
                            <input type="password" id="password" class="form-control" placeholder="Password" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100">Register Company</button>
                </form>
                <div class="text-center mt-3">
                    <small>Already registered? <a href="/">Go to login</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('togglePassword').addEventListener('click', function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = this.querySelector('i');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.classList.remove('fa-eye');
        toggleBtn.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        toggleBtn.classList.remove('fa-eye-slash');
        toggleBtn.classList.add('fa-eye');
    }
});

document.getElementById('registerCompanyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        name: document.getElementById('company_name').value,
        email: document.getElementById('email').value,
        company_name: document.getElementById('company_name').value,
        hr_contact: document.getElementById('hr_contact').value
    };

    const res = await fetch('/api/auth/register/company', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    const result = await res.json();
    alert(result.message);
    if (res.ok) window.location.href = '/';
});
</script>
{% endblock %}
