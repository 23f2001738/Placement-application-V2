{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5">
                <h3 class="text-center mb-4">Student Registration</h3>
                <form id="registerStudentForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <input type="text" id="name" class="form-control" placeholder="Full Name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <input type="text" id="username" class="form-control" placeholder="Username" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <input type="email" id="email" class="form-control" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" id="password" class="form-control" placeholder="Password" required>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <input type="text" id="branch" class="form-control" placeholder="Branch (e.g. CSE)" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <input type="number" step="0.01" id="cgpa" class="form-control" placeholder="CGPA" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <input type="number" id="year" class="form-control" placeholder="Year" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100">Register as Student</button>
                </form>
                <div class="text-center mt-3">
                    <small>Already registered? <a href="/">Go to login</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('registerStudentForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        branch: document.getElementById('branch').value,
        cgpa: parseFloat(document.getElementById('cgpa').value),
        year: parseInt(document.getElementById('year').value)
    };

    const res = await fetch('/api/auth/register/student', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    const result = await res.json();
    alert(result.message);
    if (res.ok) window.location.href = '/';
});
</script>
{% endblock %}
